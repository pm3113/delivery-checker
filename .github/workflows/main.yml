name: Build, Deploy Backend and Shopify Extension

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # JOB 1: BUILD DOCKER IMAGE AND PUSH TO AMAZON ECR
  # ============================================================

  docker:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t delivery-checker .

      # Step 5: Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag delivery-checker:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      # Step 6: Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest


  # ============================================================
  # JOB 2: DEPLOY SHOPIFY APP + THEME EXTENSION
  # ============================================================

  shopify:
    name: Deploy Shopify App and Extension
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Shopify CLI
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      # Step 5: Deploy Shopify app and extension
      - name: Deploy Shopify app and extension
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          shopify app deploy --allow-updates